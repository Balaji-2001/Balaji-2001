name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Balaji-2001
          output_path: trophy.svg
          theme: tokyonight
          no-frame: "true"
          row: "1"
          column: "7"
          margin-w: "8"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy.svg back to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate trophy.svg"
          file_pattern: trophy.svg
